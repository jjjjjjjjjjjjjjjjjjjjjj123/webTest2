<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-image: url('brownBack.png'); background-size: cover; background-repeat: repeat-y;">

    <div class="center-container">
        <div class="input-wrapper">
            <input class="card" type="text" id="nameInput" placeholder="Enter name here" maxlength="16" />
        </div>
        <div class="button-wrapper">
            <button class="card" id="confirmBtn" onclick="connectWebSocket()" disabled>Connect</button>
        </div>
    </div>

    <p id="status">Not Connected</p>

    <script src="recieve.js"></script>
    <script src="connect.js"></script>
    <script src="buttonMaker.js"></script>
    <script src="webStyles.js"></script>

    <script>
        let socket;

        function connectWebSocket() {
            const name = document.getElementById("nameInput").value.trim();

            if (!name) {
                alert("Please enter a name.");
                return;
            }

            const params = new URLSearchParams(window.location.search);
            let wsPart = params.get('ws');

            if (!wsPart) {
                alert("Missing WebSocket server in URL. Use ?ws=yourserver.com");
                return;
            }

            const fullUrl = "wss://" + wsPart + "/game";
            socket = new WebSocket(fullUrl);

            socket.onopen = () => handleSocketOpen(socket, wsPart, name);
            socket.onmessage = handleSocketMessage;
            socket.onclose = () => handleSocketClose();
            socket.onerror = (error) => handleSocketError(error);

            // Hide inputs after connecting
            document.getElementById("nameInput").style.display = "none";
            document.getElementById("confirmBtn").style.display = "none";
        }

        // Enable/disable confirm button based on name input
        document.addEventListener("DOMContentLoaded", () => {
            const nameInput = document.getElementById("nameInput");
            const confirmBtn = document.getElementById("confirmBtn");

            nameInput.addEventListener("input", () => {
                confirmBtn.disabled = nameInput.value.trim() === "";
            });
        });

        function sendPlayerAction(action) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "action", action }));
            } else {
                alert("WebSocket not connected!");
            }
        }
    </script>
</body>
</html>
