<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-image: url('brownBack.png'); background-size: cover; background-repeat: repeat-y;">

    <!-- This input is hidden by default unless ?ws is missing -->
    <input class="card" type="text" id="wsUrl" placeholder="Enter WebSocket URL" style="display: none;" />
    
    <!-- Name input stays visible -->
    <input class="card" type="text" id="nameInput" placeholder="Enter name here">
    
    <!-- Connect button is renamed for clarity -->
    <button class="card" id="connectBtn" onclick="connectWebSocket()">Confirm</button>

    <p id="status">Not Connected</p>

    <script src="recieve.js"></script>
    <script src="connect.js"></script>
    <script src="buttonMaker.js"></script>
    <script src="webStyles.js"></script>

    <script>
        let socket;

        function connectWebSocket() {
            const params = new URLSearchParams(window.location.search);
            let wsPart = params.get('ws');

            // If not in URL, show input and use that
            if (!wsPart) {
                wsPart = document.getElementById("wsUrl").value.trim();
            }

            if (!wsPart) {
                alert("WebSocket URL missing!");
                return;
            }

            const name = document.getElementById("nameInput").value.trim();
            if (!name) {
                alert("Please enter a name.");
                return;
            }

            socket = new WebSocket("wss://" + wsPart + "/game");

            socket.onopen = () => handleSocketOpen(socket, wsPart, name);
            socket.onmessage = handleSocketMessage;
            socket.onclose = handleSocketClose;
            socket.onerror = handleSocketError;

            // Hide inputs
            document.getElementById("nameInput").style.display = "none";
            document.getElementById("wsUrl").style.display = "none";
            document.getElementById("connectBtn").style.display = "none";
        }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const wsParamExists = params.get('ws');

            if (!wsParamExists) {
                // No URL param? Show input to manually enter WebSocket URL
                document.getElementById("wsUrl").style.display = "inline-block";
            }
        };
    </script>

</body>
</html>
